[daemon]
# Keep current physical modes/layout; false selects the original single-primary behavior.
preserve_physical_monitors = true
layout_mode = 1
layout_retries = 20
startup_timeout = 15

[primary]
name = "primary"
# Replace this with your physical connector from the daemon log, or remove the
# line to use GNOME's current primary monitor.
connector = "HDMI-1"
# Physical mode fields are used only when preservation is false.
width = 1920
height = 1080
refresh = 120
scale = 1.0

[[monitor]]
name = "laptop"
width = 1366
height = 768
refresh = 60
scale = 1.0
relative_to = "primary"
position = "left"
alignment = "center"

[[monitor]]
name = "phone"
# Virtual monitors must use unique width/height pairs so the daemon can map
# each new Mutter output back to its configured role.
width = 2340
height = 1080
refresh = 120
# The daemon selects Mutter's nearest supported value, not literal 1.75.
scale = 1.75
relative_to = "primary"
position = "below"
alignment = "center"
